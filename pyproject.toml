[project]
name = "rondo"
version = "0.1.0"
description = "Team Rondo: per-frame possession labelling for More Than A Hack 2027, Phase 1"
readme = "README.md"
authors = [
    { name = "Imisioluwa", email = "obasekiimisi5@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "kloppy==3.18.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
]

[project.scripts]
rondo = "rondo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rondo"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vendor"]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
